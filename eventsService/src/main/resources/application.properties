spring.application.name=eventsService
server.port=8080

spring.datasource.url=jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

account.service.base-url=http://localhost:8081

# Rate Limiting
resilience4j.ratelimiter.instances.eventSubmission.register-health-indicator=true
resilience4j.ratelimiter.instances.eventSubmission.limit-refresh-period=1m
resilience4j.ratelimiter.instances.eventSubmission.limit-for-period=100

# Async retry for PENDING events
event.retry.enabled=true
event.retry.interval-minutes=5
event.retry.max-attempts=3

management.endpoints.web.exposure.include=health,info
